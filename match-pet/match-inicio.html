<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--FONTE-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Suez+One&display=swap" rel="stylesheet">

    <!--REMIXICON-->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet">

    <!--ESTILOS-->
    <link rel="stylesheet" href="../rede-connect-pet/estilos-rede/tela-inicial.css">
    <link rel="stylesheet" href="./estilos-match/match-inicio.css">
    <link rel="stylesheet" href="../rede-connect-pet/estilos-rede/nav-inferior.css">
    <title>Connect pet</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="topo-header">
                <a href="../rede-connect-pet/tela-inicial.html"><img src="../imagens/logo-matchpet-provisoria.png" alt="" class="matchpet"></a>
                <h2 class="bem-vindo-match"><strong>Bem-vindo</strong> ao Match Pet</h2>
                <button  id="outras-opcoes" popovertarget="mais-opcoes"><i class="ri-menu-line"></i></button>

                

                <div id="mais-opcoes" popover>
                    <a href="../rede-connect-pet/perfil.html" title="Perfil">
                        <i class="ri-user-line"></i>
                        <p>Perfil</p>
                    </a>

                    <a href="../rede-connect-pet/configuracoes.html" title="Configurações">
                        <i class="ri-settings-3-line"></i>
                        <p>Configurações</p>
                    </a>

                    <a href="../rede-connect-pet/ajuda.html" title="Ajuda">
                        <i class="ri-question-line"></i>
                        <p>Ajuda</p>
                    </a>

                    <button class="sair" title="Sair">
                        <i class="ri-shut-down-line"></i>
                        <p>Sair</p>
                    </button>
                </div>
            </div>
            <div class="bottom-header">
                <a href="../rede-connect-pet/perfil.html?pet_id=1"><img src="../imagens/rex.png" alt="" class="foto-perfil-pet"></a>
                <div class="barra-pesquisa-filtro">
                    <div class="barra-de-pesquisa">
                        <input class="pesquisa" type="text" placeholder="Pesquisar">
                        <button class="pesquisar">
                            <img src="../icons/icone-pesquisar.png" alt="">
                        </button>
                    </div>
                    <button popovertarget="filtros" class="filtrar">
                        <img src="../icons/icone-filtro.png" alt="">
                    </button>
                    <div id="filtros" popover>
                        <h2>Filtros</h2>
                        <button class="Recentes">Recentes</button>
                        <button class="Ultima-semana">Última semana</button>
                        <button class="Mais-vistos">Mais vistos</button>
                        <button class="Amigos">Amigos</button>
                    </div>
                </div>

                <!--Aparecera apenas para pc -->
                <div class="navegacao-pc">
                    <button popovertarget="menu-pc">
                        <img src="../imagens/barra-inferior/Vector.png" alt="navegacao-pc">
                    </button>
                </div>

                <div id="menu-pc" popover>
                    <a href="../rede-connect-pet/tela-inicial.html" class="ativo" title="Início">
                        <i class="ri-home-2-line"></i>
                        <p>Início</p>
                    </a>

                    <a href="../rede-connect-pet/trofeus.html" title="Medalhas">
                        <i class="ri-award-line"></i>
                        <p>Troféus</p>
                    </a>

                    <a href="../rede-connect-pet/criar-post.html">
                        <img title="Criar" src="../imagens/barra-inferior/criar.png" alt="criar">
                        <p>Criar Publicação</p>
                    </a>

                    <a href="../rede-connect-pet/chat-pet.html">
                        <img title="Chat pet" src="../imagens/barra-inferior/chatpet.png" alt="Chat pet">
                        <p>Chatpet</p>
                    </a>

                    <a href="../rede-connect-pet/favoritos.html">
                         <img title="favoritos" src="../imagens/barra-inferior/heart-3-line 3.png" alt="favoritos">
                        <p>Favoritos</p>
                    </a>
                </div>
            </div>
        </header>

        <main class="perfis-match">
            <section class="perfil-match">
                <button class="sortear-match"><i class="ri-arrow-right-long-line"></i></button>
                <div class="container-post">
                    <div class="header-post">
                        <a href="../rede-connect-pet/conhecer-perfil.html?pet_id=1"><img src="../imagens/logo-connect.jpg" alt=""></a>
                        <div>
                            <!--os dados reais aqui podem aparecer no paragrafo mesmo, use suas classes -->
                            <div class="nome-pet-dopet">
                                <p class="nome-pet">Nome do pet</p>
                                <p class="identificacao-pet">@dopet</p>
                            </div>
                            <p class="data-post">2 dias atrás</p>
                        </div>
                        <button class="btn-seguir">Seguir</button>
                    </div>
                    <div class="conteudo-post">
                        <img src="../imagens/logo-connect.jpg" alt="">
                    </div>

                </div>
                <button class="match"><i class="ri-heart-line"></i></button>
            </section>
            <section class="comentarios-match">
                <h2>Comentarios</h2>
                <div class="comentarios">
                    <div class="comentario">
                        <div class="header-comentario">
                            <a href=""><img src="../imagens/mia.png" alt=""></a>
                            <div>
                                <p class="nome-usuario-comentario">Nome do usuário</p>
                                <p class="conteudo-comentario">Quem sabe você não poderia almoçar comigo!</p>
                            </div>
                        </div>
                        <div class="acoes">
                            <button popovertarget="acoes" class="acoes-comentario">...</button>
                            <button class="curtir-comentario"><i class="ri-heart-line"></i></button>
                        </div>
                    </div>
                    
                </div>
                <section class="adicionar-comentario">
                    <input type="text" placeholder="Adicione um comentário...">
                    <button class="enviar-comentario"><i class="ri-send-plane-2-line"></i></button>
                </section>
            </section>
        </main>

        <a class="chats" href="./match-chat.html">
            <img src="../imagens/match-chat.png" alt="">
            <p>Seus chats <i class="ri-heart-line"></i></p>
        </a>

        <!--APARECE APENAS PARA CELULAR-->
        <nav class="nav-inferior">
            <a href="../rede-connect-pet/tela-inicial.html" title="Início">
                <i class="ri-home-2-line"></i>
            </a>

            <a href="../rede-connect-pet/trofeus.html" title="Medalhas">
                <i class="ri-award-line"></i>
            </a>
            <a href="../rede-connect-pet/criar-post.html">
                <img title="Criar" src="../imagens/barra-inferior/criar.png" alt="criar">
            </a>
            <a href="../rede-connect-pet/chat-pet.html">
                <img title="Chat pet" src="../imagens/barra-inferior/chatpet.png" alt="Chat pet">
            </a>
            <a href="../rede-connect-pet/favoritos.html">
                <img title="favoritos" src="../imagens/barra-inferior/heart-3-line 3.png" alt="favoritos">
            </a>
        </nav>
    </div>
</body>
</html>
