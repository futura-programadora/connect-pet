<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--FONTE-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="shortcut icon" href="../imagens/logo-connect.jpg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&display=swap" rel="stylesheet">

  <!--REMIXICON-->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet">

  <!--ESTILOS-->
  <link rel="stylesheet" href="./estilos-rede/configuracoes.css">
  <link rel="stylesheet" href="./estilos-rede/nav-inferior.css">

  <title>Connect Pet — Configurações</title>
</head>

<body>
  <div class="container">
    <header class="config-header">
      <!-- Topo com botão voltar e título -->
      <div class="topo-config">
        <a href="./tela-inicial.html" class="voltar">
          <i class="ri-arrow-left-line"></i>
          <p>Configurações</p>
        </a>

        <!--Aparecera apenas para pc -->
        <div class="navegacao-pc">
          <button popovertarget="menu-pc">
            <img src="../imagens/barra-inferior/Vector.png" alt="navegacao-pc">
          </button>
        </div>

        <div id="menu-pc" popover>
          <a href="./tela-inicial.html" title="Início">
            <i class="ri-home-2-line"></i>
            <p>Início</p>
          </a>

          <a href="./trofeus.html" title="Medalhas">
            <i class="ri-award-line"></i>
            <p>Troféus</p>
          </a>

          <a href="./criar-post.html">
            <img title="Criar" src="../imagens/barra-inferior/criar.png" alt="criar">
            <p>Criar Publicação</p>
          </a>

          <a href="./chat-pet.html">
            <img title="Chat pet" src="../imagens/barra-inferior/chatpet.png" alt="Chat pet">
            <p>Chatpet</p>
          </a>

          <a href="./favoritos.html">
            <img title="favoritos" src="../imagens/barra-inferior/heart-3-line 3.png" alt="favoritos">
            <p>Favoritos</p>
          </a>
        </div>
      </div>



    </header>

    <main class="configuracoes">
      <div class="config-lista">

        <!-- ITEM 1 -->
        <details class="item">
          <summary>
            <i class="ri-time-line"></i>
            <span>Atividade</span>
            <i class="ri-arrow-down-s-line seta"></i>
          </summary>

          <div class="conteudo">
            <label><input type="checkbox"> Mostrar histórico</label>
            <label><input type="checkbox"> Notificações de login</label>
            <button class="salvar">Salvar</button>
          </div>
        </details>

        <!-- ITEM 2 -->
        <details class="item">
          <summary>
            <i class="ri-shield-keyhole-line"></i>
            <span>Dados e Privacidade</span>
            <i class="ri-arrow-down-s-line seta"></i>
          </summary>

          <div class="conteudo">
            <label><input type="checkbox"> Proteção por PIN</label>
            <label><input type="checkbox"> Limpar atividade automaticamente</label>
            <button class="salvar">Salvar</button>
          </div>
        </details>

        <!-- ITEM 3 -->
        <details class="item">
          <summary>
            <i class="ri-question-line"></i>
            <span>Suporte</span>
            <i class="ri-arrow-down-s-line seta"></i>
          </summary>

          <div class="conteudo">
            <label><input type="checkbox"> Enviar relatórios automáticos</label>
            <button class="salvar">Salvar</button>
          </div>
        </details>

        <!-- ITEM 4 -->
        <details class="item">
          <summary>
            <i class="ri-information-line"></i>
            <span>Novidades</span>
            <i class="ri-arrow-down-s-line seta"></i>
          </summary>

          <div class="conteudo">
            <label><input type="checkbox"> Receber novidades</label>
            <button class="salvar">Salvar</button>
          </div>
        </details>

        <!-- ITEM 5 -->
        <details class="item">
          <summary>
            <i class="ri-translate-2"></i>
            <span class="texto-duplo">
              Idioma
              <small>Português, Brasil</small>
            </span>
            <i class="ri-arrow-down-s-line seta"></i>
          </summary>

          <div class="conteudo">
            <label><input type="radio" name="idioma"> Português, Brasil</label>
            <label><input type="radio" name="idioma"> Inglês</label>
            <label><input type="radio" name="idioma"> Espanhol</label>
            <button class="salvar">Salvar</button>
          </div>
        </details>

        <!-- ITEM 6 -->
        <details class="item">
          <summary>
            <i class="ri-user-heart-line"></i>
            <span>Amigos Próximos</span>
            <i class="ri-arrow-down-s-line seta"></i>
          </summary>

          <div class="conteudo">
            <label><input type="checkbox"> Permitir solicitações</label>
            <label><input type="checkbox"> Mostrar atividade para amigos</label>
            <button class="salvar">Salvar</button>
          </div>
        </details>

        <!-- ITEM 7 -->
        <details class="item">
          <summary>
            <i class="ri-forbid-line"></i>
            <span>Bloqueados</span>
            <i class="ri-arrow-down-s-line seta"></i>
          </summary>

          <div class="conteudo">
            <label><input type="text" placeholder="Adicionar usuário"></label>
            <button class="salvar">Salvar</button>
          </div>
        </details>

        <!-- SAIR -->
        <div class="item sair sair-link">
          <a href="../index.html">
            <i class="ri-logout-box-line"></i>
            <span>Sair da Conta</span>
          </a>
        </div>


      </div>
    </main>

    <!-- NAV INFERIOR -->
    <nav class="nav-inferior">
      <a href="./tela-inicial.html" title="Início">
        <i class="ri-home-2-line"></i>
      </a>

      <a href="./trofeus.html" title="Medalhas">
        <i class="ri-award-line"></i>
      </a>
      <a href="./criar-post.html">
        <img title="Criar" src="../imagens/barra-inferior/criar.png" alt="criar">
      </a>
      <a href="./chat-pet.html">
        <img title="Chat pet" src="../imagens/barra-inferior/chatpet.png" alt="Chat pet">
      </a>
      <a href="./favoritos.html">
        <img title="favoritos" src="../imagens/barra-inferior/heart-3-line 3.png" alt="favoritos">
      </a>
    </nav>
  </div>
</body>

</html>
